[package]
name = "v3-game-server-util"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["http1", "http2", "macros", "query", "tokio"] }
chrono = "0.4"
glc = { git = "https://github.com/vassalengine/game-library-common.git" }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9", features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
toml = "1.0"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-deflate", "compression-gzip", "compression-zstd", "set-header", "timeout", "trace"] }
tracing = "0.1"
